<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2874F0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<title>Browse Menu — Desk2Dine</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <a href="index.html" class="brand" style="text-decoration:none;">
      <span class="brand-icon"><span class="material-symbols-outlined">restaurant</span></span>
      Desk2Dine <span class="portal-label" id="portalLabel">Canteen</span>
    </a>

    <div class="topbar-center">
      <div class="topbar-search-form">
        <span class="material-symbols-outlined topbar-search-icon">search</span>
        <input type="text" id="topbarSearchInput" class="topbar-search-input" placeholder="Search for food, snacks, beverages..." autocomplete="off">
        <button type="button" class="topbar-search-clear" id="topbarSearchClear" title="Clear search">
          <span class="material-symbols-outlined" style="font-size:16px;">close</span>
        </button>
      </div>
    </div>

    <div class="topbar-right">
      <a href="menu.html" class="topbar-nav-link active" title="Browse Menu">
        <span class="material-symbols-outlined">restaurant_menu</span>
        <span class="nav-text">Menu</span>
      </a>

      <a href="my-orders.html" class="topbar-nav-link" title="My Orders">
        <span class="material-symbols-outlined">receipt_long</span>
        <span class="nav-text">Orders</span>
      </a>

      <a href="cart.html" class="icon-btn cart-badge" id="cartIcon" title="Cart">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="badge-count topbar-cart-count" style="display:none;"></span>
      </a>

      <button class="icon-btn" id="notifBtn" onclick="window.location.href='notifications.html'" style="display:none;">
        <span class="material-symbols-outlined">notifications</span>
        <span class="badge-dot" id="notifBadge" style="display:none;"></span>
      </button>

      <span class="topbar-user" id="topbarUserName" style="display:none;"></span>

      <button class="logout-btn" onclick="logout()" style="display:none;">
        <span class="material-symbols-outlined" style="font-size:18px;">logout</span> Logout
      </button>
    </div>
  </header>

  <div class="subnav" id="subnav"></div>

  <main class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h1><span class="material-symbols-outlined" style="font-size:28px;vertical-align:middle;">restaurant_menu</span> Canteen Menu</h1>
      <a href="index.html" class="btn btn-outline btn-sm">
        <span class="material-symbols-outlined">home</span> Back to Home
      </a>
    </div>

    <div class="filter-row">
      <div class="search-bar" style="flex:2;">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="searchInput" placeholder="Search for food, snacks and beverages...">
        <button class="search-clear" onclick="document.getElementById('searchInput').value='';document.getElementById('searchInput').dispatchEvent(new Event('input'));">
          <span class="material-symbols-outlined" style="font-size:16px;">close</span>
        </button>
      </div>
      <div class="field" style="flex:1;">
        <label for="categoryFilter"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">category</span> Category</label>
        <select id="categoryFilter"><option value="">All categories</option></select>
      </div>
      <div class="field" style="flex:1;">
        <label for="sortBy">Sort by</label>
        <select id="sortBy">
          <option value="name">Name</option>
          <option value="price">Price</option>
        </select>
      </div>
      <div class="field" style="flex:1;">
        <label for="sortDir">Order</label>
        <select id="sortDir">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
      </div>
    </div>

    <div id="menuList"></div>
    <div id="pagination"></div>
  </main>

  <nav class="mobile-nav" id="mobileNav"></nav>

  <footer class="site-footer">Desk2Dine &copy; 2026 &mdash; Faculty Canteen Order System</footer>

  <div class="toast" id="toast"></div>

  <script src="js/common.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
