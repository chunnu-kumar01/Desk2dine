<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2874F0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<title>Reset Password — Desk2Dine</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo"><span class="mark">Desk2Dine</span></div>
      <h1>Set a new password</h1>
      <div class="auth-sub">Choose a strong password you haven't used before</div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password">
          <div class="password-strength"><div class="password-strength-fill" id="strengthFill"></div></div>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your new password" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
          <span class="material-symbols-outlined">lock_reset</span> Reset Password
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html"><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">arrow_back</span> Back to login</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/common.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
