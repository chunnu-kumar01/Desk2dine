<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2874F0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<title>Favourites — Desk2Dine</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
</head>
<body>

  <div class="topbar">
    <span class="brand">
      <span class="brand-icon"><span class="material-symbols-outlined">restaurant</span></span>
      Desk2Dine <span class="portal-label" id="portalLabel">Faculty</span>
    </span>
    <div class="topbar-right">
      <a href="cart.html" class="icon-btn cart-badge" id="cartIcon" title="Cart">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="badge-count topbar-cart-count" style="display:none;"></span>
      </a>
      <button class="icon-btn" onclick="window.location.href='notifications.html'">
        <span class="material-symbols-outlined">notifications</span>
        <span class="badge-dot" id="notifBadge" style="display:none;"></span>
      </button>
      <span class="topbar-user" id="topbarUserName"></span>
      <button class="logout-btn" onclick="logout()">
        <span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;">logout</span> Logout
      </button>
    </div>
  </div>
  <div class="subnav" id="subnav"></div>

  <main class="page">
    <h1><span class="material-symbols-outlined" style="font-size:28px;vertical-align:middle;color:#f43f5e;">favorite</span> My Favourites</h1>
    <div id="favList"></div>
  </main>

  <nav class="mobile-nav" id="mobileNav"></nav>

  <footer class="site-footer">Desk2Dine &copy; 2026 &mdash; Faculty Canteen Order System</footer>

  <div class="toast" id="toast"></div>

  <script src="js/common.js"></script>
  <script src="js/favourites.js"></script>
</body>
</html>
