<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Desk2Dine</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
</head>
<body>

  <div class="topbar">
    <span class="brand">Desk2Dine <span class="portal-label">Admin</span></span>
    <div class="topbar-right">
      <button class="icon-btn" onclick="window.location.href='notifications.html'">
        <span class="material-symbols-outlined">notifications</span>
        <span class="badge-dot" id="notifBadge" style="display:none;"></span>
      </button>
      <span class="topbar-user" id="topbarUserName"></span>
      <button class="logout-btn" onclick="logout()">
        <span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;">logout</span> Logout
      </button>
    </div>
  </div>
  <div class="subnav">
    <button class="tab-btn active" data-tab="orders"><span class="material-symbols-outlined">receipt_long</span> Orders</button>
    <button class="tab-btn" data-tab="menu"><span class="material-symbols-outlined">restaurant_menu</span> Menu Items</button>
    <button class="tab-btn" data-tab="categories"><span class="material-symbols-outlined">category</span> Categories</button>
    <button class="tab-btn" data-tab="locations"><span class="material-symbols-outlined">location_on</span> Locations</button>
    <button class="tab-btn" data-tab="users"><span class="material-symbols-outlined">group</span> Users</button>
    <button class="tab-btn" data-tab="audit"><span class="material-symbols-outlined">history</span> Audit Logs</button>
    <a href="profile.html" style="margin-left:auto;"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;">person</span> Profile</a>
  </div>

  <main class="page wide">

    <!-- ORDERS TAB -->
    <section id="tab-orders" class="tab-panel">
      <h1>Order Counter</h1>
      <div class="stat-grid" id="adminStats">
        <div class="stat-card">
          <div class="stat-icon blue"><span class="material-symbols-outlined">shopping_cart</span></div>
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange"><span class="material-symbols-outlined">pending</span></div>
          <div class="stat-value" id="statPlaced">0</div>
          <div class="stat-label">Pending Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><span class="material-symbols-outlined">check_circle</span></div>
          <div class="stat-value" id="statCompleted">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple"><span class="material-symbols-outlined">payments</span></div>
          <div class="stat-value" id="statRevenue">₹0</div>
          <div class="stat-label">Revenue</div>
        </div>
      </div>
      <div class="filter-row">
        <div class="field">
          <label for="orderStatusFilter">Filter by status</label>
          <select id="orderStatusFilter">
            <option value="">All statuses</option>
            <option value="PLACED">Placed</option>
            <option value="DELIVERED">Delivered</option>
            <option value="RECEIVED">Received</option>
            <option value="BILLED">Billed</option>
            <option value="PAID">Paid</option>
            <option value="COMPLETED">Completed</option>
          </select>
        </div>
      </div>
      <div id="ordersWrap"></div>
      <div id="ordersPagination"></div>
    </section>

    <!-- MENU ITEMS TAB -->
    <section id="tab-menu" class="tab-panel" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h1>Menu Items</h1>
        <button class="btn btn-success btn-sm" onclick="openMenuItemForm()">
          <span class="material-symbols-outlined">add</span> Add Item
        </button>
      </div>
      <div class="filter-row">
        <div class="field"><label>Search</label><input type="text" id="menuSearch" placeholder="Search items..."></div>
        <div class="field"><label>Category</label><select id="menuCategoryFilter"><option value="">All</option></select></div>
      </div>
      <div id="menuItemsWrap"></div>
      <div id="menuItemsPagination"></div>

      <div class="panel" id="menuItemFormPanel" style="display:none; margin-top:20px;">
        <h2 id="menuItemFormTitle">Add Menu Item</h2>
        <form id="menuItemForm" novalidate>
          <input type="hidden" id="menuItemId">
          <div class="field-row">
            <div class="field"><label>Name</label><input type="text" id="miName"></div>
            <div class="field"><label>Category</label><select id="miCategory"></select></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Price (&#x20B9;)</label><input type="number" step="0.01" id="miPrice"></div>
            <div class="field"><label>Available</label>
              <select id="miAvailable"><option value="true">Yes</option><option value="false">No</option></select>
            </div>
          </div>
          <div class="field"><label>Description (optional)</label><input type="text" id="miDescription"></div>
            <div class="field"><label>Image</label><input type="file" id="miImage"></div>
          <button type="submit" class="btn btn-primary" id="menuItemSaveBtn">
            <span class="material-symbols-outlined">save</span> Save Item
          </button>
          <button type="button" class="btn-link" style="margin-left:14px;" onclick="closeMenuItemForm()">Cancel</button>
        </form>
      </div>
    </section>

    <!-- CATEGORIES TAB -->
    <section id="tab-categories" class="tab-panel" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h1>Categories</h1>
        <button class="btn btn-success btn-sm" onclick="openCategoryForm()">
          <span class="material-symbols-outlined">add</span> Add Category
        </button>
      </div>
      <div id="categoriesWrap"></div>

      <div class="panel" id="categoryFormPanel" style="display:none; margin-top:20px;">
        <h2 id="categoryFormTitle">Add Category</h2>
        <form id="categoryForm" novalidate>
          <input type="hidden" id="categoryId">
          <div class="field"><label>Name</label><input type="text" id="catName"></div>
          <div class="field"><label>Description (optional)</label><input type="text" id="catDescription"></div>
          <button type="submit" class="btn btn-primary" id="categorySaveBtn">
            <span class="material-symbols-outlined">save</span> Save Category
          </button>
          <button type="button" class="btn-link" style="margin-left:14px;" onclick="closeCategoryForm()">Cancel</button>
        </form>
      </div>
    </section>

    <!-- DELIVERY LOCATIONS TAB -->
    <section id="tab-locations" class="tab-panel" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h1>Delivery Locations</h1>
        <button class="btn btn-success btn-sm" onclick="openLocationForm()">
          <span class="material-symbols-outlined">add</span> Add Location
        </button>
      </div>
      <div id="locationsWrap"></div>

      <div class="panel" id="locationFormPanel" style="display:none; margin-top:20px;">
        <h2 id="locationFormTitle">Add Location</h2>
        <form id="locationForm" novalidate>
          <input type="hidden" id="locationId">
          <div class="field"><label>Name</label><input type="text" id="locName" placeholder="e.g. F-204, CSE Block"></div>
          <div class="field-row">
            <div class="field"><label>Block</label><input type="text" id="locBlock"></div>
            <div class="field"><label>Floor</label><input type="text" id="locFloor"></div>
          </div>
          <button type="submit" class="btn btn-primary" id="locationSaveBtn">
            <span class="material-symbols-outlined">save</span> Save Location
          </button>
          <button type="button" class="btn-link" style="margin-left:14px;" onclick="closeLocationForm()">Cancel</button>
        </form>
      </div>
    </section>

    <!-- USERS TAB -->
    <section id="tab-users" class="tab-panel" style="display:none;">
      <h1>Users</h1>
      <div class="filter-row">
        <div class="field"><label>Search</label><input type="text" id="userSearch" placeholder="Search by name or email..."></div>
        <div class="field">
          <label>Role</label>
          <select id="userRoleFilter"><option value="">All</option><option value="FACULTY">Faculty</option><option value="ADMIN">Admin</option></select>
        </div>
      </div>
      <div id="usersWrap"></div>
      <div id="usersPagination"></div>
    </section>

    <!-- AUDIT LOGS TAB -->
    <section id="tab-audit" class="tab-panel" style="display:none;">
      <h1>Audit Logs</h1>
      <div class="filter-row">
        <div class="field">
          <label>Action</label>
          <select id="auditActionFilter">
            <option value="">All actions</option>
            <option value="SIGNUP">SIGNUP</option>
            <option value="LOGIN">LOGIN</option>
            <option value="LOGIN_FAILED">LOGIN_FAILED</option>
            <option value="LOGOUT">LOGOUT</option>
            <option value="PASSWORD_CHANGED">PASSWORD_CHANGED</option>
            <option value="PASSWORD_RESET">PASSWORD_RESET</option>
            <option value="ORDER_PLACED">ORDER_PLACED</option>
            <option value="ORDER_DELIVERED">ORDER_DELIVERED</option>
            <option value="ORDER_RECEIVED">ORDER_RECEIVED</option>
            <option value="ORDER_BILLED">ORDER_BILLED</option>
            <option value="ORDER_PAID">ORDER_PAID</option>
            <option value="ORDER_COMPLETED">ORDER_COMPLETED</option>
            <option value="MENU_ITEM_CREATED">MENU_ITEM_CREATED</option>
            <option value="MENU_ITEM_UPDATED">MENU_ITEM_UPDATED</option>
            <option value="MENU_ITEM_DELETED">MENU_ITEM_DELETED</option>
          </select>
        </div>
      </div>
      <div id="auditWrap"></div>
      <div id="auditPagination"></div>
    </section>

  </main>

  <footer class="site-footer">Desk2Dine &copy; 2026</footer>

  <div class="toast" id="toast"></div>

  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
